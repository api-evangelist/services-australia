apis:
- name: Services Australia Health and Aged Care Web Services
  description: Business-to-business web services that let registered software vendors' products connect to Services Australia digital health and
    aged care channels (Medicare Online including ECLIPSE and DVA claiming, the Australian Immunisation Register, PBS Online and aged care), authenticated
    through PRODA B2B devices. Technical specifications and licensed development material are distributed only through the Health Systems Developer
    Portal to registered vendors, and software must pass Notice of Integration / Notice of Connection testing; no public machine-readable contract
    (OpenAPI, WSDL, AsyncAPI) was found.
  humanURL: https://healthsoftware.humanservices.gov.au/claiming/ext-vnd/
