aid: services-australia

name: Services Australia

description: Services Australia is the Australian Government agency (formerly the Department of Human Services) that delivers Centrelink, Medicare
  and Child Support payments and services. For software developers it runs the Health Systems Developer Portal (healthsoftware.humanservices.gov.au),
  launched in September 2020 as a secure gateway to licensed development material, technical documentation, forums and support for its health,
  aged care and Australian Immunisation Register web services, including online claiming, with NOI/NOC certification testing for vendor software.

